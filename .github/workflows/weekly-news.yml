name: Weekly news archive

# Every Monday 09:00 IST: pull the week's JSW Combat / Jaecoo J5 / iCAR V23
# stories from the publisher feeds into src/data/press-archive.json and commit.
# The commit to master triggers the usual Vercel deploy. Live headlines on the
# News & Guides page refresh on their own every few hours in between.
on:
  schedule:
    - cron: "30 3 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: weekly-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Check feeds
        run: node scripts/check-news-feed.mjs

      - name: Update press archive
        run: node scripts/update-press-archive.ts

      - name: Commit if changed
        run: |
          if git diff --quiet -- src/data/press-archive.json; then
            echo "No new stories this week."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/press-archive.json
          git commit -m "Weekly news archive update"
          git push
